apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.storeName }}
  annotations:
    # Marks this object as infra-owned so it is clear it is NOT managed by ArgoCD.
    zord.arealis.io/owner: terraform
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.awsRegion | required "awsRegion must be provided by Terraform" }}
      # EKS Pod Identity: the External Secrets controller's ServiceAccount is bound
      # to an IAM role scoped to <env>/zord/*, so no static credentials are needed
      # and no IRSA annotation is required. An empty auth block tells ESO to use the
      # pod's ambient AWS identity.
      auth: {}
