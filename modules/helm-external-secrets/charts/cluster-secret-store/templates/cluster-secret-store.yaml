{{/*
  API version is configurable because it changed across External Secrets Operator
  releases. ESO stopped serving external-secrets.io/v1beta1 in 0.17.0; from there
  on only external-secrets.io/v1 is served (v1beta1 returns only when the chart's
  crds.unsafeServeV1Beta1 flag is enabled, which defaults to false). Hardcoding
  v1beta1 is what produced "no matches for kind ClusterSecretStore in version
  external-secrets.io/v1beta1". Terraform passes the value matching the pinned
  chart version.
*/}}
apiVersion: {{ .Values.apiVersion | required "apiVersion must be provided by Terraform" }}
kind: ClusterSecretStore
metadata:
  name: {{ .Values.storeName }}
  annotations:
    # Marks this object as infra-owned so it is clear it is NOT managed by ArgoCD.
    zord.arealis.io/owner: terraform
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.awsRegion | required "awsRegion must be provided by Terraform" }}
      # EKS Pod Identity: the External Secrets controller's ServiceAccount is bound
      # to an IAM role scoped to <env>/zord/*, so no static credentials are needed
      # and no IRSA annotation is required. An empty auth block tells ESO to use the
      # pod's ambient AWS identity.
      auth: {}
