# EC2NodeClass — how Karpenter builds nodes (AMI, role, subnets, SGs via cluster tags).
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  role: {{ .Values.nodeRole | quote }}
  amiSelectorTerms:
    - alias: al2023@latest
  # Subnets: select by explicit ID (reliable — no dependence on cluster tags).
  subnetSelectorTerms:
    {{- range .Values.subnetIds }}
    - id: {{ . | quote }}
    {{- end }}
  # Security groups: the EKS cluster SG is auto-tagged kubernetes.io/cluster/<name>=owned.
  securityGroupSelectorTerms:
    - tags:
        kubernetes.io/cluster/{{ .Values.clusterName }}: owned
  tags:
    # Friendly console name for Karpenter-launched nodes (otherwise they show as
    # the raw ip-10-x-x hostname). Managed node groups get their Name from the
    # launch template; Karpenter nodes get it from these EC2NodeClass tags.
    Name: {{ printf "%s karpenter stateless node" .Values.clusterName | quote }}
    karpenter.sh/discovery: {{ .Values.clusterName | quote }}
    ManagedBy: karpenter
---
# NodePool — the policy: cheapest instance that fits pending pods; consolidate when idle.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        workload: stateless
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: {{ .Values.categories | toJson }}
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: {{ .Values.sizes | toJson }}
        - key: karpenter.sh/capacity-type
          operator: In
          values: {{ .Values.capacityTypes | toJson }}
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      expireAfter: 720h
  # Consolidation: repack pods onto fewer nodes and remove the empties/underused.
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
  # Cost guardrail: never provision more than this many total vCPUs.
  limits:
    cpu: {{ .Values.cpuLimit }}
