name: Zord Infrastructure

run-name: "Zord ${{ inputs.action || 'validate' }} (${{ inputs.environment || 'staging' }})"

# ════════════════════════════════════════════════════════════════════════
# ONE workflow, THREE boxes, nothing ever skipped.
#
# GitHub always draws every job in a workflow, and a job with a false `if:`
# appears as a greyed "skipped" node. So instead of separate apply/destroy/plan
# jobs, the middle job performs whichever action you chose and renames itself.
# You therefore always see exactly:
#     Step 1 Check  ->  Step 2 <action>  ->  Step 3 Report
# and never an irrelevant skipped box.
# ════════════════════════════════════════════════════════════════════════

on:
  pull_request:
    paths:
      - "live/**"
      - "stacks/**"
      - "modules/**"
      - ".github/workflows/infrastructure.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        default: staging
        options: [production, staging, dev]
      action:
        description: Action
        required: true
        type: choice
        default: plan
        options: [plan, apply, destroy]
      confirm_destroy:
        description: Type yes to confirm destroy
        required: false
        default: "no"

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ap-south-1
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_github_pat: ${{ secrets.ARGOCD_GITHUB_PAT }}
  COMPONENTS: "01-foundation 02-data 03-compute 04-security 05-platform 06-edge"

jobs:
  # ─── BOX 1 ── always runs ────────────────────────────────────────────
  check:
    name: Step 1 - Check all components
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      - name: Check formatting and validate all 6 components
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          for c in $COMPONENTS; do
            echo "::group::validate $c"
            terraform -chdir="live/components/$c" init -backend=false -input=false
            terraform -chdir="live/components/$c" validate -no-color
            echo "::endgroup::"
          done

  # ─── BOX 2 ── always runs; does the action you picked ────────────────
  run:
    name: "Step 2 - ${{ inputs.action || 'plan' }} ${{ inputs.environment || 'staging' }}"
    needs: check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TARGET_ENV: ${{ inputs.environment }}
      ACTION: ${{ inputs.action }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Run plan / apply / destroy for this environment
        shell: bash
        run: |
          set -euo pipefail
          export TF_VAR_environment="$TARGET_ENV"
          read -ra COMPS <<< "$COMPONENTS"

          init() {
            terraform -chdir="live/components/$1" init -reconfigure -input=false \
              -backend-config="$GITHUB_WORKSPACE/live/environments/$TARGET_ENV/backend.hcl" \
              -backend-config="bucket=$TF_STATE_BUCKET" \
              -backend-config="key=eks/$TARGET_ENV/$1.tfstate"
          }
          has_state() { aws s3api head-object --bucket "$TF_STATE_BUCKET" --key "eks/$TARGET_ENV/$1.tfstate" >/dev/null 2>&1; }

          case "$ACTION" in
            apply)
              for c in "${COMPS[@]}"; do
                echo "::group::apply $c"; init "$c"
                terraform -chdir="live/components/$c" apply -auto-approve -no-color
                echo "::endgroup::"
              done
              ;;

            destroy)
              [[ "${{ inputs.confirm_destroy }}" == "yes" ]] || { echo "confirm_destroy must be yes"; exit 1; }
              cluster=$(jq -r .cluster_name "live/environments/$TARGET_ENV/config.json")
              if aws eks describe-cluster --name "$cluster" --region "$AWS_REGION" >/dev/null 2>&1; then
                aws eks update-kubeconfig --name "$cluster" --region "$AWS_REGION"
                kubectl delete ingress --all -A --ignore-not-found --wait=false || true
                kubectl delete pvc --all -A --ignore-not-found --wait=false || true
                for app in $(kubectl get applications.argoproj.io -n argocd -o name 2>/dev/null || true); do
                  kubectl patch "$app" -n argocd --type merge -p '{"metadata":{"finalizers":[]}}' || true
                done
                sleep 45
              fi
              for ((i=${#COMPS[@]}-1; i>=0; i--)); do
                c="${COMPS[$i]}"
                has_state "$c" || { echo "skip $c (no state)"; continue; }
                echo "::group::destroy $c"; init "$c"
                terraform -chdir="live/components/$c" destroy -auto-approve -no-color
                echo "::endgroup::"
              done
              ;;

            *)  # plan
              upstream=true
              for c in "${COMPS[@]}"; do
                echo "::group::plan $c"; init "$c"
                if [[ "$upstream" == true ]]; then
                  set +e
                  terraform -chdir="live/components/$c" plan -no-color -input=false -detailed-exitcode
                  rc=$?; set -e
                  [[ $rc -eq 1 ]] && exit 1
                else
                  echo "SKIP: upstream state absent; apply earlier components first."
                fi
                has_state "$c" || upstream=false
                echo "::endgroup::"
              done
              ;;
          esac

  # ─── BOX 3 ── always runs; reports what the action produced ──────────
  report:
    name: "Step 3 - Report ${{ inputs.environment || 'staging' }}"
    needs: run
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TARGET_ENV: ${{ inputs.environment }}
      ACTION: ${{ inputs.action }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Summarize this environment
        shell: bash
        run: |
          set -uo pipefail
          config="live/environments/$TARGET_ENV/config.json"
          cluster=$(jq -r .cluster_name "$config")
          export TF_VAR_environment="$TARGET_ENV"

          count() { # live count of one resource type, scoped to this cluster tag
            case "$1" in
              eks)  aws eks describe-cluster --name "$cluster" --region "$AWS_REGION" --query 'cluster.status' --output text 2>/dev/null || echo "-" ;;
              ng)   aws eks list-nodegroups --cluster-name "$cluster" --region "$AWS_REGION" --query 'length(nodegroups)' --output text 2>/dev/null || echo 0 ;;
              vpc)  aws ec2 describe-vpcs --region "$AWS_REGION" --filters "Name=tag:Cluster,Values=$cluster" --query 'length(Vpcs)' --output text 2>/dev/null || echo 0 ;;
              nat)  aws ec2 describe-nat-gateways --region "$AWS_REGION" --filter "Name=tag:Cluster,Values=$cluster" "Name=state,Values=available" --query 'length(NatGateways)' --output text 2>/dev/null || echo 0 ;;
              eip)  aws ec2 describe-addresses --region "$AWS_REGION" --filters "Name=tag:Cluster,Values=$cluster" --query 'length(Addresses)' --output text 2>/dev/null || echo 0 ;;
              rds)  aws rds describe-db-instances --region "$AWS_REGION" --query "length(DBInstances[?TagList[?Key=='Cluster'&&Value=='$cluster']])" --output text 2>/dev/null || echo 0 ;;
              ec2)  aws ec2 describe-instances --region "$AWS_REGION" --filters "Name=tag:Cluster,Values=$cluster" "Name=instance-state-name,Values=pending,running,stopping,stopped" --query 'length(Reservations[].Instances[])' --output text 2>/dev/null || echo 0 ;;
            esac
          }
          s3_present=0
          for b in $(jq -r '.buckets | to_entries[] | select(.value|type=="string") | .value' "$config"); do
            aws s3api head-bucket --bucket "$b" >/dev/null 2>&1 && s3_present=$((s3_present+1))
          done

          {
            echo "## Zord $TARGET_ENV — $ACTION"
            echo ""
            echo "Scoped to \`Cluster=$cluster\` and state \`eks/$TARGET_ENV/\`. Other environments are never touched."
            echo ""
            echo "| Resource | Value |"
            echo "|---|---|"
            echo "| EKS cluster \`$cluster\` | $(count eks) |"
            echo "| EKS node groups | $(count ng) |"
            echo "| VPCs | $(count vpc) |"
            echo "| NAT gateways | $(count nat) |"
            echo "| Elastic IPs | $(count eip) |"
            echo "| RDS instances | $(count rds) |"
            echo "| EC2 instances | $(count ec2) |"
            echo "| S3 buckets present | $s3_present |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$ACTION" == "destroy" ]]; then
            left=0
            for k in ng vpc nat eip rds ec2; do
              v=$(count "$k"); [[ "$v" =~ ^[0-9]+$ ]] && left=$((left+v))
            done
            left=$((left + s3_present))
            {
              if [[ "$left" -eq 0 ]]; then
                echo "### Clean destroy: 0 billable resources remain for **$TARGET_ENV**."
              else
                echo "### $left resource(s) still exist for **$TARGET_ENV** — review the table above."
              fi
              echo ""
              echo "**Kept on purpose (shared):** state bucket \`$TF_STATE_BUCKET\`, wildcard ACM cert, apex SES identity."
              echo ""
              echo "> Verifies **$TARGET_ENV only**. This does not claim the whole account bill is zero."
            } >> "$GITHUB_STEP_SUMMARY"

          elif [[ "$ACTION" == "apply" ]]; then
            C=live/components/05-platform
            terraform -chdir="$C" init -reconfigure -input=false \
              -backend-config="$GITHUB_WORKSPACE/live/environments/$TARGET_ENV/backend.hcl" \
              -backend-config="bucket=$TF_STATE_BUCKET" \
              -backend-config="key=eks/$TARGET_ENV/05-platform.tfstate" >/dev/null 2>&1
            urls=$(terraform -chdir="$C" output -json platform_urls 2>/dev/null || echo '{}')
            {
              echo "### Platform URLs"
              echo "| Service | URL |"
              echo "|---|---|"
              echo "$urls" | jq -r 'to_entries[] | "| \(.key) | \(.value) |"' 2>/dev/null || echo "| (see 05-platform outputs) | - |"
              echo ""
              echo "### ArgoCD Applications"
              echo "| Application | Sync | Health |"
              echo "|---|---|---|"
              if aws eks update-kubeconfig --name "$cluster" --region "$AWS_REGION" >/dev/null 2>&1; then
                kubectl -n argocd get applications -o json 2>/dev/null \
                  | jq -r '.items[] | "| \(.metadata.name) | \(.status.sync.status // "Unknown") | \(.status.health.status // "Unknown") |"' \
                  || echo "| (none yet) | - | - |"
              else
                echo "| (cluster not reachable) | - | - |"
              fi
              echo ""
              echo "> Observability auto-syncs (declared in Terraform). Platform and Kong are MANUAL:"
              echo "> build the 10 images in Jenkins, then Sync them in the ArgoCD UI."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
