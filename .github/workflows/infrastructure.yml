name: Zord Infrastructure

run-name: "Zord ${{ inputs.action || 'validate' }} (${{ inputs.environment || 'staging' }})"

# ════════════════════════════════════════════════════════════════════════
# ONE workflow, THREE boxes, nothing ever skipped.
#
# GitHub always draws every job in a workflow, and a job with a false `if:`
# appears as a greyed "skipped" node. So instead of separate apply/destroy/plan
# jobs, the middle job performs whichever action you chose and renames itself.
# You therefore always see exactly:
#     Step 1 Check  ->  Step 2 <action>  ->  Step 3 Report
# and never an irrelevant skipped box.
# ════════════════════════════════════════════════════════════════════════

on:
  pull_request:
    paths:
      - "live/**"
      - "stacks/**"
      - "modules/**"
      - "scripts/**"
      - ".github/workflows/infrastructure.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        default: staging
        options: [production, staging, dev]
      action:
        description: Action
        required: true
        type: choice
        default: plan
        options: [plan, apply, destroy]
      confirm_destroy:
        description: Type yes to confirm destroy
        required: false
        default: "no"

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ap-south-1
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_github_pat: ${{ secrets.ARGOCD_GITHUB_PAT }}
  COMPONENTS: "01-foundation 02-data 03-compute 04-security 05-platform 06-edge"

jobs:
  # ─── BOX 1 ── always runs ────────────────────────────────────────────
  check:
    name: Step 1 - Check all components
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      - name: Check formatting and validate all 6 components
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          for c in $COMPONENTS; do
            echo "::group::validate $c"
            terraform -chdir="live/components/$c" init -backend=false -input=false
            terraform -chdir="live/components/$c" validate -no-color
            echo "::endgroup::"
          done

  # ─── BOX 2 ── always runs; does the action you picked ────────────────
  run:
    name: "Step 2 - ${{ inputs.action || 'plan' }} ${{ inputs.environment || 'staging' }}"
    needs: check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TARGET_ENV: ${{ inputs.environment }}
      ACTION: ${{ inputs.action }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Run plan / apply / destroy for this environment
        shell: bash
        run: |
          set -euo pipefail
          export TF_VAR_environment="$TARGET_ENV"
          read -ra COMPS <<< "$COMPONENTS"

          init() {
            terraform -chdir="live/components/$1" init -reconfigure -input=false \
              -backend-config="$GITHUB_WORKSPACE/live/environments/$TARGET_ENV/backend.hcl" \
              -backend-config="bucket=$TF_STATE_BUCKET" \
              -backend-config="key=eks/$TARGET_ENV/$1.tfstate"
          }
          has_state() { aws s3api head-object --bucket "$TF_STATE_BUCKET" --key "eks/$TARGET_ENV/$1.tfstate" >/dev/null 2>&1; }

          case "$ACTION" in
            apply)
              chmod +x scripts/destroy-cleanup.sh || true
              for c in "${COMPS[@]}"; do
                # Before compute: remove any stale creator access entry that EKS
                # auto-created (bootstrap=true on a prior build) so Terraform can
                # create + own the admin entry without a 409 collision.
                [[ "$c" == "03-compute" ]] && bash scripts/destroy-cleanup.sh preapply "$TARGET_ENV" "$AWS_REGION"
                echo "::group::apply $c"; init "$c"
                terraform -chdir="live/components/$c" apply -auto-approve -no-color
                echo "::endgroup::"
              done
              ;;

            destroy)
              [[ "${{ inputs.confirm_destroy }}" == "yes" ]] || { echo "confirm_destroy must be yes"; exit 1; }
              cluster=$(jq -r .cluster_name "live/environments/$TARGET_ENV/config.json")
              if aws eks describe-cluster --name "$cluster" --region "$AWS_REGION" >/dev/null 2>&1; then
                aws eks update-kubeconfig --name "$cluster" --region "$AWS_REGION"
                # Delete the k8s objects that spawn AWS resources so the controllers
                # deprovision them (ingresses -> ALBs, LB services -> NLBs, PVCs -> EBS).
                kubectl delete ingress --all -A --ignore-not-found --wait=false || true
                kubectl delete svc --all -A --field-selector spec.type=LoadBalancer --ignore-not-found --wait=false || true
                kubectl delete pvc --all -A --ignore-not-found --wait=false || true
                for app in $(kubectl get applications.argoproj.io -n argocd -o name 2>/dev/null || true); do
                  kubectl patch "$app" -n argocd --type merge -p '{"metadata":{"finalizers":[]}}' || true
                done
                sleep 45
              fi

              # Cleanup of resources Terraform does NOT own (K8s-created ALBs/ENIs +
              # External-DNS records) lives in scripts/destroy-cleanup.sh. It is
              # best-effort and never aborts the destroy.
              chmod +x scripts/destroy-cleanup.sh || true

              for ((i=${#COMPS[@]}-1; i>=0; i--)); do
                c="${COMPS[$i]}"
                has_state "$c" || { echo "skip $c (no state)"; continue; }
                # Safety net: before tearing down compute, force-delete any node
                # groups still attached to the cluster so EKS DeleteCluster can't
                # block with "Cluster has nodegroups attached" on a drifted state.
                [[ "$c" == "03-compute" ]] && bash scripts/destroy-cleanup.sh nodegroups "$TARGET_ENV" "$AWS_REGION"
                echo "::group::destroy $c"; init "$c"
                terraform -chdir="live/components/$c" destroy -auto-approve -no-color
                echo "::endgroup::"
                # After the platform (LB controller) is destroyed, sweep orphaned
                # ALBs/ENIs so 01-foundation (VPC) can be torn down. The controller is
                # dead now, so it cannot recreate the ALB.
                [[ "$c" == "05-platform" ]] && bash scripts/destroy-cleanup.sh sweep "$TARGET_ENV" "$AWS_REGION"
                # Sweep AGAIN right before the VPC (01-foundation) is destroyed:
                # by now the EKS cluster + all Karpenter nodes are gone, so this
                # catches any leftover Karpenter instance/ENI that would otherwise
                # block subnet deletion with DependencyViolation (the #106 failure).
                if [[ "$c" == "02-data" ]]; then
                  bash scripts/destroy-cleanup.sh sweep "$TARGET_ENV" "$AWS_REGION"
                fi
              done
              # All components gone — clean up what Terraform doesn't own:
              #  - orphaned Route53 records (staging/dev only; prod skipped)
              #  - orphaned CloudWatch log groups (EKS + VPC flow logs, per-env)
              bash scripts/destroy-cleanup.sh dns "$TARGET_ENV" "$AWS_REGION"
              bash scripts/destroy-cleanup.sh logs "$TARGET_ENV" "$AWS_REGION"
              bash scripts/destroy-cleanup.sh ecr "$TARGET_ENV" "$AWS_REGION"
              ;;

            *)  # plan
              upstream=true
              for c in "${COMPS[@]}"; do
                echo "::group::plan $c"; init "$c"
                if [[ "$upstream" == true ]]; then
                  set +e
                  terraform -chdir="live/components/$c" plan -no-color -input=false -detailed-exitcode
                  rc=$?; set -e
                  [[ $rc -eq 1 ]] && exit 1
                else
                  echo "SKIP: upstream state absent; apply earlier components first."
                fi
                has_state "$c" || upstream=false
                echo "::endgroup::"
              done
              ;;
          esac

  # ─── BOX 3 ── always runs; reports what the action produced ──────────
  report:
    name: "Step 3 - Report ${{ inputs.environment || 'staging' }}"
    needs: run
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TARGET_ENV: ${{ inputs.environment }}
      ACTION: ${{ inputs.action }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Summarize this environment
        shell: bash
        run: bash scripts/report.sh
