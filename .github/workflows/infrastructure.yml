name: Zord Infrastructure

run-name: >-
  ${{
    github.event.inputs.action == 'apply'
    && format('Zord Infra Apply ({0}) — Deploy Everything', github.event.inputs.environment)
    || github.event.inputs.action == 'destroy'
    && format('Zord Infra Destroy ({0}) — Remove Everything', github.event.inputs.environment)
    || format('Zord Infra Plan ({0})', github.event.inputs.environment || 'production')
  }}

on:
  pull_request:
    paths:
      - "EKS-terraform/**"
      - ".github/workflows/infrastructure.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: production
        type: choice
        options:
          - production
      action:
        description: "Choose action"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy
      confirm_destroy:
        description: "Type yes to confirm destroy"
        required: false
        default: "no"
        type: string

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: "EKS-terraform"
  AWS_REGION_VALUE: "ap-south-1"

jobs:
  # ════════════════════════════════════════════════════════════════
  # PR Plan — auto-runs on pull requests
  # ════════════════════════════════════════════════════════════════
  terraform-plan-pr:
    name: Terraform Plan On PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # Pinned to 1.11.4 — S3-native state locking (use_lockfile) is GA here.
          # No DynamoDB needed; state locking is handled by the S3 bucket itself.
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION_VALUE }}
          role-duration-seconds: 3600

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=eks/production/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION_VALUE }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (production)
        run: |
          set +e
          terraform plan -var="environment=production" -no-color -input=false -lock=false -detailed-exitcode
          code=$?
          echo "terraform plan exit code: $code"
          # 0 = no changes, 2 = changes present. Both are success for a PR plan.
          # Only 1 is a real error.
          if [ "$code" -eq 1 ]; then
            exit 1
          fi
          exit 0

  # ════════════════════════════════════════════════════════════════
  # Manual — Plan / Apply / Destroy (deploys everything at once)
  # ════════════════════════════════════════════════════════════════
  terraform:
    name: "Zord Infrastructure ${{ github.event.inputs.action }} (${{ github.event.inputs.environment }})"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_WORKING_DIR }}

    env:
      TF_VAR_environment: ${{ github.event.inputs.environment }}
      # GitHub PAT for the ArgoCD private-repo secret. Secret name must NOT start
      # with GITHUB_ (reserved by GitHub), so it's stored as ARGOCD_GITHUB_PAT.
      TF_VAR_github_pat: ${{ secrets.ARGOCD_GITHUB_PAT }}
      STATE_KEY: "eks/${{ github.event.inputs.environment }}/terraform.tfstate"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # Pinned to 1.11.4 — S3-native state locking (use_lockfile) is GA here.
          # No DynamoDB needed; state locking is handled by the S3 bucket itself.
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION_VALUE }}
          role-duration-seconds: 7200

      - name: Validate destroy confirmation
        if: github.event.inputs.action == 'destroy'
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "yes" ]; then
            echo "Destroy requires confirm_destroy = yes"
            exit 1
          fi

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION_VALUE }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform Validate
        run: terraform validate

      # ── PLAN ──
      - name: Terraform Plan
        if: github.event.inputs.action == 'plan'
        run: terraform plan -no-color

      # ── APPLY ──
      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        id: terraform_apply
        continue-on-error: true
        run: terraform apply -auto-approve -no-color

      - name: Debug — Retry Apply on Failure
        if: github.event.inputs.action == 'apply' && steps.terraform_apply.outcome == 'failure'
        run: |
          echo "============================================"
          echo "  ❌ FIRST APPLY FAILED — RETRYING"
          echo "============================================"
          echo ""
          echo "--- Resources created before failure ---"
          terraform state list 2>/dev/null | head -50 || echo "(no state)"
          echo ""
          echo "--- Retrying with debug log ---"
          TF_LOG=ERROR terraform apply -auto-approve -no-color 2>&1 | tail -100
          exit 1

      # ── POST-APPLY: Verify everything ──
      - name: Apply Verification
        if: github.event.inputs.action == 'apply' && steps.terraform_apply.outcome == 'success'
        run: |
          REGION="${{ env.AWS_REGION_VALUE }}"
          CLUSTER_NAME=$(terraform output -raw cluster_name)
          ENV="${{ github.event.inputs.environment }}"

          TOTAL_RESOURCES=$(terraform state list 2>/dev/null | grep -c '.' || echo "0")

          # Compute
          EKS_STATUS=$(aws eks describe-cluster --name "${CLUSTER_NAME}" --region "${REGION}" --query "cluster.status" --output text 2>/dev/null || echo "N/A")
          EKS_VERSION=$(aws eks describe-cluster --name "${CLUSTER_NAME}" --region "${REGION}" --query "cluster.version" --output text 2>/dev/null || echo "N/A")
          NODE_COUNT=$(aws ec2 describe-instances --region "${REGION}" --filters "Name=instance-state-name,Values=running" "Name=tag:eks:cluster-name,Values=${CLUSTER_NAME}" --query 'Reservations[*].Instances[*].InstanceId' --output text 2>/dev/null | wc -w || echo "0")
          EC2_ID=$(aws ec2 describe-instances --region "${REGION}" --filters "Name=tag:Project,Values=arealis-zord-eks" "Name=tag:Name,Values=*admin*" "Name=instance-state-name,Values=running,stopped" --query 'Reservations[0].Instances[0].InstanceId' --output text 2>/dev/null || echo "N/A")
          EC2_IP=$(terraform output -raw ec2_public_ip 2>/dev/null || echo "N/A")

          # Network
          VPC_ID=$(terraform output -raw vpc_id 2>/dev/null || echo "N/A")
          VPC_STATUS=$(aws ec2 describe-vpcs --vpc-ids "${VPC_ID}" --region "${REGION}" --query "Vpcs[0].State" --output text 2>/dev/null || echo "N/A")
          SUBNET_COUNT=$(aws ec2 describe-subnets --region "${REGION}" --filters "Name=vpc-id,Values=${VPC_ID}" --query 'Subnets[*].SubnetId' --output text 2>/dev/null | wc -w || echo "0")
          NAT_COUNT=$(aws ec2 describe-nat-gateways --region "${REGION}" --filter "Name=vpc-id,Values=${VPC_ID}" "Name=state,Values=available" --query 'NatGateways[*].NatGatewayId' --output text 2>/dev/null | wc -w || echo "0")
          SG_COUNT=$(aws ec2 describe-security-groups --region "${REGION}" --filters "Name=vpc-id,Values=${VPC_ID}" --query 'SecurityGroups[*].GroupId' --output text 2>/dev/null | wc -w || echo "0")

          # Database
          RDS_ENDPOINT=$(terraform output -raw rds_endpoint 2>/dev/null || echo "N/A")
          RDS_STATUS=$(aws rds describe-db-instances --region "${REGION}" --query "DBInstances[?starts_with(DBInstanceIdentifier,'arealis-zord')].DBInstanceStatus | [0]" --output text 2>/dev/null || echo "N/A")

          # Storage
          OUR_BUCKETS="zord-edge-ingress zord-intent-engine-canonical zord-intent-engine-nir zord-intent-engine-governance zord-outcome-engine-settlement-ingress zord-evidence-vault"
          S3_COUNT=0
          for b in $OUR_BUCKETS; do aws s3api head-bucket --bucket "$b" >/dev/null 2>&1 && S3_COUNT=$((S3_COUNT+1)); done
          EBS_COUNT=$(aws ec2 describe-volumes --region "${REGION}" --filters "Name=status,Values=in-use" "Name=tag:kubernetes.io/cluster/${CLUSTER_NAME},Values=owned" --query 'Volumes[*].VolumeId' --output text 2>/dev/null | wc -w || echo "0")

          # Security & secrets
          IAM_ROLES=$(aws iam list-roles --query "Roles[?starts_with(RoleName,'arealis-zord')].RoleName" --output text 2>/dev/null | wc -w || echo "0")
          SECRET_COUNT=$(aws secretsmanager list-secrets --region "${REGION}" --filters Key=name,Values="${ENV}/zord" --query 'SecretList[*].Name' --output text 2>/dev/null | wc -w || echo "0")
          KMS_COUNT=$(aws kms list-aliases --region "${REGION}" --query "Aliases[?contains(AliasName,'zord')].AliasName" --output text 2>/dev/null | wc -w || echo "0")
          SES_DOMAIN=$(terraform output -raw ses_domain 2>/dev/null || echo "N/A")

          # Addons
          ADDONS=$(aws eks list-addons --cluster-name "${CLUSTER_NAME}" --region "${REGION}" --query 'addons' --output text 2>/dev/null | tr '\t' ' ' || echo "N/A")

          # Edge (CloudFront + WAF)
          CF_ENABLED=$(terraform output -raw cloudfront_enabled 2>/dev/null || echo "false")
          CF_DOMAIN=$(terraform output -raw cloudfront_domain_name 2>/dev/null || echo "")
          CF_DIST_COUNT=$(aws cloudfront list-distributions --query "DistributionList.Items[?contains(Comment,'arealis-zord')].Id" --output text 2>/dev/null | wc -w || echo "0")
          WAF_ACL_COUNT=$(aws wafv2 list-web-acls --scope CLOUDFRONT --region us-east-1 --query "WebACLs[?contains(Name,'arealis-zord')].Id" --output text 2>/dev/null | wc -w || echo "0")
          if [ "${CF_ENABLED}" = "true" ]; then CF_STATUS="active — ${CF_DOMAIN}"; else CF_STATUS="skipped (Kong ALB not up yet — auto-enables next apply)"; fi

          # Kong / in-cluster load balancer (only ones owned by this cluster)
          LB_COUNT=0
          for arn in $(aws elbv2 describe-load-balancers --region "${REGION}" --query 'LoadBalancers[*].LoadBalancerArn' --output text 2>/dev/null); do
            [ -z "$arn" ] && continue
            OWNED=$(aws elbv2 describe-tags --region "${REGION}" --resource-arns "$arn" --query "TagDescriptions[0].Tags[?Key=='elbv2.k8s.aws/cluster' || Key=='ingress.k8s.aws/stack'] | [?contains(Value,'zord') || contains(Value,'arealis')].Value" --output text 2>/dev/null)
            [ -n "$OWNED" ] && LB_COUNT=$((LB_COUNT+1))
          done

          {
            echo "## Zord Infrastructure — ${ENV} — Apply Complete"
            echo ""
            echo "| Metric | Count |"
            echo "|---|---|"
            echo "| Total Resources Created | ${TOTAL_RESOURCES} |"
            echo ""
            echo "### AWS Resource Status (End-to-End Check)"
            echo ""
            echo "| Resource | Status | Details |"
            echo "|---|---|---|"
            echo "| EKS Cluster | ${EKS_STATUS} | ${CLUSTER_NAME} (v${EKS_VERSION}) |"
            echo "| EKS Nodes (running) | ${NODE_COUNT} | stateful + stateless groups |"
            echo "| VPC | ${VPC_STATUS} | ${VPC_ID} |"
            echo "| Subnets | ${SUBNET_COUNT} | 2 public + 2 private |"
            echo "| NAT Gateways | ${NAT_COUNT} | private subnet egress |"
            echo "| Security Groups | ${SG_COUNT} | in VPC |"
            echo "| EC2 Bastion | running | ${EC2_IP} |"
            echo "| RDS PostgreSQL | ${RDS_STATUS} | ${RDS_ENDPOINT}:5432 |"
            echo "| S3 Buckets | ${S3_COUNT}/6 | edge, canonical, nir, governance, outcome, evidence |"
            echo "| EBS Volumes (in-use) | ${EBS_COUNT} | cluster PVCs |"
            echo "| IAM Roles | ${IAM_ROLES} | arealis-zord-* |"
            echo "| Secrets Manager | ${SECRET_COUNT} | ${ENV}/zord/* |"
            echo "| KMS Keys | ${KMS_COUNT} | S3, token-enclave, evidence-archive |"
            echo "| SES Domain | verified | ${SES_DOMAIN} |"
            echo "| CloudFront | ${CF_DIST_COUNT} | ${CF_STATUS} |"
            echo "| WAF WebACL (us-east-1) | ${WAF_ACL_COUNT} | Common + KnownBadInputs + SQLi + BotControl + rate-limit |"
            echo "| Load Balancer (Kong) | ${LB_COUNT} | in-cluster ALB via LB Controller |"
            echo "| EKS Addons | | ${ADDONS} |"
            echo ""
            echo "### Access Commands"
            echo ""
            echo "| Action | Command |"
            echo "|---|---|"
            echo "| SSM to Bastion | \`aws ssm start-session --target ${EC2_ID} --region ${REGION}\` |"
            echo "| EKS kubeconfig | \`aws eks update-kubeconfig --region ${REGION} --name ${CLUSTER_NAME}\` |"
            echo ""
            echo "### Verification (run on EC2 bastion after SSM)"
            echo ""
            echo "\`\`\`bash"
            echo "aws eks update-kubeconfig --region ${REGION} --name ${CLUSTER_NAME}"
            echo "kubectl get nodes -o wide"
            echo "kubectl get pods -n kube-system | grep -E 'autoscaler|aws-node|coredns|ebs-csi'"
            echo "kubectl get pods -n external-secrets"
            echo "kubectl get pods -n argocd"
            echo "kubectl get applications -n argocd"
            echo "kubectl get ingress -A"
            echo "\`\`\`"
            echo ""
            echo "### Cost While Running"
            echo ""
            echo "| Period | Cost |"
            echo "|---|---|"
            echo "| Per Day | ~\$18 |"
            echo "| Per Month | ~\$540 |"
            echo ""
            echo "> Destroy when done: Run this workflow with action \`destroy\`, confirm_destroy = \`yes\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── DESTROY ──
      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        id: terraform_destroy
        continue-on-error: true
        run: |
          REGION="${{ env.AWS_REGION_VALUE }}"
          CLUSTER_NAME=$(terraform output -raw cluster_name 2>/dev/null || echo "")
          [ -z "${CLUSTER_NAME}" ] && { terraform destroy -auto-approve -no-color; exit $?; }

          CLUSTER_STATUS=$(aws eks describe-cluster --name "${CLUSTER_NAME}" --region "${REGION}" --query 'cluster.status' --output text 2>/dev/null || echo "NOT_FOUND")

          if [ "$CLUSTER_STATUS" == "ACTIVE" ]; then
            echo "EKS cluster ACTIVE. Cleaning Kubernetes resources before destroy..."
            curl -sLO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl && sudo mv kubectl /usr/local/bin/
            if ! command -v helm >/dev/null 2>&1; then
              curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
            fi
            aws eks update-kubeconfig --region "${REGION}" --name "${CLUSTER_NAME}"

            # Remove validating/mutating webhooks (they block resource deletion)
            kubectl delete validatingwebhookconfiguration --all --ignore-not-found=true 2>/dev/null || true
            kubectl delete mutatingwebhookconfiguration --all --ignore-not-found=true 2>/dev/null || true

            # Remove finalizers from all namespaces (prevents stuck deletion)
            for ns in $(kubectl get ns --no-headers 2>/dev/null | awk '{print $1}'); do
              case "$ns" in kube-system|kube-public|kube-node-lease|default) continue;; esac
              kubectl patch ns "$ns" --type json -p='[{"op":"remove","path":"/metadata/finalizers"}]' 2>/dev/null || true
              kubectl patch ns "$ns" --type json -p='[{"op":"replace","path":"/spec/finalizers","value":[]}]' 2>/dev/null || true
            done

            # Uninstall all Helm releases
            helm list -A -o json 2>/dev/null \
              | jq -r '.[] | .name + " " + .namespace' \
              | while read -r RELEASE NS; do
                  [ -z "${RELEASE}" ] && continue
                  echo "Uninstalling: ${RELEASE} in namespace: ${NS}"
                  helm uninstall "${RELEASE}" --namespace "${NS}" --ignore-not-found || true
                done || true

            # Delete LoadBalancer services (they create AWS LBs outside Terraform)
            kubectl get svc -A -o jsonpath='{range .items[?(@.spec.type=="LoadBalancer")]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' 2>/dev/null | while read -r NS SVC; do
              [ -z "$NS" ] && continue
              kubectl delete svc "$SVC" -n "$NS" --ignore-not-found=true || true
            done

            # Delete Ingresses (they create ALBs)
            kubectl get ingress -A -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' 2>/dev/null | while read -r NS ING; do
              [ -z "$NS" ] && continue
              kubectl delete ingress "$ING" -n "$NS" --ignore-not-found=true || true
            done

            # Delete PVCs (they create EBS volumes)
            kubectl get pvc -A --no-headers 2>/dev/null | while read -r NS PVC _; do
              [ -z "$NS" ] && continue
              kubectl delete pvc "$PVC" -n "$NS" --ignore-not-found=true --timeout=30s || true
            done

            # Delete non-system namespaces
            for ns in $(kubectl get ns --no-headers 2>/dev/null | awk '{print $1}'); do
              case "$ns" in kube-system|kube-public|kube-node-lease|default) continue;; esac
              kubectl delete namespace "$ns" --ignore-not-found=true --wait=false --timeout=30s || true
            done

            echo "Waiting 90s for AWS resources (LBs, ENIs) to release..."
            sleep 90
          else
            echo "EKS cluster not ACTIVE (status: ${CLUSTER_STATUS}). Removing K8s/Helm resources from Terraform state..."
            terraform state list 2>/dev/null | grep -E '^(module\..+\.kubernetes_|module\..+\.helm_|module\..+\.kubectl_|kubernetes_)' | while read -r resource; do
              echo "  Removing from state: $resource"
              terraform state rm "$resource" 2>/dev/null || true
            done || true
          fi

          # Delete orphaned CloudWatch log group (EKS auto-creates it)
          aws logs delete-log-group --log-group-name "/aws/eks/${CLUSTER_NAME}/cluster" --region "${REGION}" 2>/dev/null || true

          # Count resources before destroy
          RESOURCES_BEFORE=$(terraform state list 2>/dev/null | grep -c '.' || echo "0")
          echo "RESOURCES_BEFORE=${RESOURCES_BEFORE}" >> "$GITHUB_ENV"

          terraform destroy -auto-approve -no-color

      - name: Terraform Destroy Retry (if first attempt failed)
        if: github.event.inputs.action == 'destroy' && steps.terraform_destroy.outcome == 'failure'
        run: |
          echo "============================================"
          echo "  First destroy failed. Cleaning orphans..."
          echo "============================================"
          REGION="${{ env.AWS_REGION_VALUE }}"

          # If state is already empty, destroy already succeeded — nothing to clean.
          if [ "$(terraform state list 2>/dev/null | grep -c '.')" -eq 0 ]; then
            echo "Terraform state is empty — destroy already complete. Nothing to do."
            exit 0
          fi

          # If cluster is gone, remove all K8s resources from state
          CLUSTER_NAME=$(terraform output -raw cluster_name 2>/dev/null || echo "")
          if [ -n "${CLUSTER_NAME}" ] && ! aws eks describe-cluster --name "${CLUSTER_NAME}" --region "${REGION}" >/dev/null 2>&1; then
            echo "EKS cluster gone. Removing K8s resources from state..."
            terraform state list 2>/dev/null | grep -E '^(module\..+\.kubernetes_|module\..+\.helm_|module\..+\.kubectl_|kubernetes_)' | while read -r resource; do
              echo "  Removing: $resource"
              terraform state rm "$resource" 2>/dev/null || true
            done || true
          fi

          # Clean orphaned ENIs and security groups
          VPC_ID="$(terraform output -raw vpc_id 2>/dev/null || true)"
          if [ -n "$VPC_ID" ]; then
            echo "Cleaning orphaned ENIs in VPC ${VPC_ID}..."
            aws ec2 describe-network-interfaces --region "${REGION}" \
              --filters "Name=vpc-id,Values=${VPC_ID}" "Name=status,Values=available" \
              --query 'NetworkInterfaces[].NetworkInterfaceId' --output text 2>/dev/null | \
              tr '\t' '\n' | while read -r eni; do
                [ -z "$eni" ] && continue
                aws ec2 delete-network-interface --region "${REGION}" --network-interface-id "$eni" || true
              done

            echo "Cleaning orphaned security groups..."
            aws ec2 describe-security-groups --region "${REGION}" \
              --filters "Name=vpc-id,Values=${VPC_ID}" \
              --query "SecurityGroups[?GroupName!='default'].GroupId" --output text 2>/dev/null | \
              tr '\t' '\n' | while read -r sg; do
                [ -z "$sg" ] && continue
                aws ec2 delete-security-group --region "${REGION}" --group-id "$sg" || true
              done
          fi

          sleep 30
          terraform destroy -auto-approve -no-color

      - name: Destroy Verification
        if: github.event.inputs.action == 'destroy'
        run: |
          REGION="${{ env.AWS_REGION_VALUE }}"
          ENV="${{ github.event.inputs.environment }}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REMAINING=$(terraform state list 2>/dev/null | grep -c '.' || echo "0")

          # ── Check every AWS resource category ──
          # EKS — only this project's clusters (name starts with arealis-zord), ignore other teams'.
          EKS_CLUSTERS=$(aws eks list-clusters --region "${REGION}" --query "clusters[?starts_with(@,'arealis-zord')]" --output text 2>/dev/null | wc -w || echo "0")
          [ "${EKS_CLUSTERS}" -eq 0 ] && EKS_STATUS="✅ Deleted" || EKS_STATUS="❌ ${EKS_CLUSTERS} cluster(s) still exist"

          # EC2 — only this project's (Project tag), ignore other teams'.
          EC2_RUNNING=$(aws ec2 describe-instances --region "${REGION}" --filters "Name=instance-state-name,Values=running" "Name=tag:Project,Values=arealis-zord-eks" --query 'Reservations[*].Instances[*].InstanceId' --output text 2>/dev/null | wc -w || echo "0")
          [ "${EC2_RUNNING}" -eq 0 ] && EC2_STATUS="✅ Deleted" || EC2_STATUS="❌ ${EC2_RUNNING} instance(s) running"

          # VPC — ONLY this project's VPC (tagged Project=arealis-zord by Terraform).
          # Other teams' VPCs in the same account are ignored.
          VPC_COUNT=$(aws ec2 describe-vpcs --region "${REGION}" --filters "Name=isDefault,Values=false" "Name=tag:Project,Values=arealis-zord-eks" --query 'Vpcs[*].VpcId' --output text 2>/dev/null | wc -w || echo "0")
          [ "${VPC_COUNT}" -eq 0 ] && VPC_STATUS="✅ Deleted" || VPC_STATUS="❌ ${VPC_COUNT} VPC(s) still exist"

          # NAT Gateways — only this project's (Project tag), ignore other teams'.
          NAT_COUNT=$(aws ec2 describe-nat-gateways --region "${REGION}" --filter "Name=state,Values=available" "Name=tag:Project,Values=arealis-zord-eks" --query 'NatGateways[*].NatGatewayId' --output text 2>/dev/null | wc -w || echo "0")
          [ "${NAT_COUNT}" -eq 0 ] && NAT_STATUS="✅ Deleted" || NAT_STATUS="❌ ${NAT_COUNT} NAT gateway(s)"

          # Elastic IPs — only this project's (Project tag), ignore other teams'.
          EIP_COUNT=$(aws ec2 describe-addresses --region "${REGION}" --filters "Name=tag:Project,Values=arealis-zord-eks" --query 'Addresses[?AssociationId==null].AllocationId' --output text 2>/dev/null | wc -w || echo "0")
          [ "${EIP_COUNT}" -eq 0 ] && EIP_STATUS="✅ Released" || EIP_STATUS="❌ ${EIP_COUNT} unassociated EIP(s)"

          # EBS Volumes (orphaned) — only this project's (Project tag), ignore other teams'.
          EBS_AVAILABLE=$(aws ec2 describe-volumes --region "${REGION}" --filters "Name=status,Values=available" "Name=tag:Project,Values=arealis-zord-eks" --query 'Volumes[*].VolumeId' --output text 2>/dev/null | wc -w || echo "0")
          [ "${EBS_AVAILABLE}" -eq 0 ] && EBS_STATUS="✅ Deleted" || EBS_STATUS="❌ ${EBS_AVAILABLE} orphaned volume(s)"

          # Load Balancers — ONLY ones created by THIS project's EKS cluster.
          # The AWS LB Controller tags every LB it makes with elbv2.k8s.aws/cluster=<cluster>.
          # Other teams' LBs in the same account (e.g. smokesimulator) are ignored.
          LB_COUNT=0
          for arn in $(aws elbv2 describe-load-balancers --region "${REGION}" --query 'LoadBalancers[*].LoadBalancerArn' --output text 2>/dev/null); do
            [ -z "$arn" ] && continue
            OWNED=$(aws elbv2 describe-tags --region "${REGION}" --resource-arns "$arn" \
              --query "TagDescriptions[0].Tags[?Key=='elbv2.k8s.aws/cluster' || Key=='ingress.k8s.aws/stack'] | [?contains(Value,'zord') || contains(Value,'arealis')].Value" \
              --output text 2>/dev/null)
            [ -n "$OWNED" ] && LB_COUNT=$((LB_COUNT+1))
          done
          [ "${LB_COUNT}" -eq 0 ] && LB_STATUS="✅ Deleted" || LB_STATUS="❌ ${LB_COUNT} zord LB(s) still exist"

          # IAM Roles
          IAM_ROLES=$(aws iam list-roles --query "Roles[?starts_with(RoleName,'arealis-zord')].RoleName" --output text 2>/dev/null | wc -w || echo "0")
          [ "${IAM_ROLES}" -eq 0 ] && IAM_STATUS="✅ Deleted" || IAM_STATUS="❌ ${IAM_ROLES} role(s)"

          # S3 Buckets — count ONLY the exact 6 buckets THIS Terraform creates.
          # Any other zord-* bucket (state bucket, another team's bucket) is ignored.
          OUR_BUCKETS="zord-edge-ingress zord-intent-engine-canonical zord-intent-engine-nir zord-intent-engine-governance zord-outcome-engine-settlement-ingress zord-evidence-vault"
          S3_COUNT=0
          for b in $OUR_BUCKETS; do
            aws s3api head-bucket --bucket "$b" >/dev/null 2>&1 && S3_COUNT=$((S3_COUNT+1))
          done
          [ "${S3_COUNT}" -eq 0 ] && S3_STATUS="✅ Deleted" || S3_STATUS="❌ ${S3_COUNT} bucket(s)"

          # Secrets Manager
          SECRET_COUNT=$(aws secretsmanager list-secrets --region "${REGION}" --filters Key=name,Values="${ENV}/zord" --query 'SecretList[*].Name' --output text 2>/dev/null | wc -w || echo "0")
          [ "${SECRET_COUNT}" -eq 0 ] && SECRET_STATUS="✅ Deleted" || SECRET_STATUS="❌ ${SECRET_COUNT} secret(s)"

          # OIDC Providers — only ones bound to a still-existing arealis-zord EKS cluster.
          # Other teams' OIDC providers in the same account are ignored.
          OIDC_COUNT=0
          for arn in $(aws iam list-open-id-connect-providers --query 'OpenIDConnectProviderList[*].Arn' --output text 2>/dev/null); do
            [ -z "$arn" ] && continue
            aws iam get-open-id-connect-provider --open-id-connect-provider-arn "$arn" \
              --query 'Tags' --output text 2>/dev/null | grep -qi "arealis-zord" && OIDC_COUNT=$((OIDC_COUNT+1))
          done
          [ "${OIDC_COUNT}" -eq 0 ] && OIDC_STATUS="✅ Deleted" || OIDC_STATUS="❌ ${OIDC_COUNT} provider(s)"

          # CloudWatch Log Groups — only this project's cluster log group, ignore other teams'.
          CW_LOGS=$(aws logs describe-log-groups --region "${REGION}" --log-group-name-prefix "/aws/eks/arealis-zord" --query 'logGroups[*].logGroupName' --output text 2>/dev/null | wc -w || echo "0")
          [ "${CW_LOGS}" -eq 0 ] && CW_STATUS="✅ Deleted" || CW_STATUS="❌ ${CW_LOGS} log group(s)"

          # EventBridge Schedulers
          SCHED_COUNT=$(aws scheduler list-schedules --region "${REGION}" --query "Schedules[?contains(Name,'arealis-zord')].Name" --output text 2>/dev/null | wc -w || echo "0")
          [ "${SCHED_COUNT}" -eq 0 ] && SCHED_STATUS="✅ Deleted" || SCHED_STATUS="❌ ${SCHED_COUNT} schedule(s)"

          # Count passed/failed
          TOTAL_CHECKS=13
          PASSED=0
          for status in "${EKS_STATUS}" "${EC2_STATUS}" "${VPC_STATUS}" "${NAT_STATUS}" "${EIP_STATUS}" "${EBS_STATUS}" "${LB_STATUS}" "${IAM_STATUS}" "${S3_STATUS}" "${SECRET_STATUS}" "${OIDC_STATUS}" "${CW_STATUS}" "${SCHED_STATUS}"; do
            echo "${status}" | grep -q "✅" && PASSED=$((PASSED + 1))
          done
          FAILED=$((TOTAL_CHECKS - PASSED))

          # Billing
          TODAY=$(date +%Y-%m-%d)
          YESTERDAY=$(date -d "yesterday" +%Y-%m-%d 2>/dev/null || echo "")
          MONTH_START=$(date +%Y-%m-01)
          DAILY_COST="N/A"
          [ -n "${YESTERDAY}" ] && DAILY_COST=$(aws ce get-cost-and-usage --time-period Start="${YESTERDAY}",End="${TODAY}" --granularity DAILY --metrics UnblendedCost --query 'ResultsByTime[0].Total.UnblendedCost.Amount' --output text 2>/dev/null || echo "N/A")
          MONTHLY_COST=$(aws ce get-cost-and-usage --time-period Start="${MONTH_START}",End="${TODAY}" --granularity MONTHLY --metrics UnblendedCost --query 'ResultsByTime[0].Total.UnblendedCost.Amount' --output text 2>/dev/null || echo "N/A")

          {
            echo "## 🗑️ Zord Infrastructure — ${ENV} — Destroy Verification"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Terraform State Remaining | ${REMAINING} |"
            echo "| AWS Checks Passed | ${PASSED}/${TOTAL_CHECKS} |"
            echo "| AWS Resources Still Exist | ${FAILED} |"
            echo ""
            echo "### AWS Resource Status (Real-Time Query)"
            echo ""
            echo "| Resource | Status |"
            echo "|---|---|"
            echo "| EKS Clusters | ${EKS_STATUS} |"
            echo "| EC2 Instances | ${EC2_STATUS} |"
            echo "| VPCs (non-default) | ${VPC_STATUS} |"
            echo "| NAT Gateways | ${NAT_STATUS} |"
            echo "| Elastic IPs (unassociated) | ${EIP_STATUS} |"
            echo "| EBS Volumes (orphaned) | ${EBS_STATUS} |"
            echo "| Load Balancers | ${LB_STATUS} |"
            echo "| IAM Roles (arealis-zord-*) | ${IAM_STATUS} |"
            echo "| S3 Buckets (zord-*) | ${S3_STATUS} |"
            echo "| Secrets Manager (${ENV}/zord/*) | ${SECRET_STATUS} |"
            echo "| OIDC Providers | ${OIDC_STATUS} |"
            echo "| CloudWatch Log Groups | ${CW_STATUS} |"
            echo "| EventBridge Schedulers | ${SCHED_STATUS} |"
            echo ""
            echo "### 💰 Billing (what you were paying)"
            echo ""
            echo "| Period | Cost (USD) |"
            echo "|---|---|"
            echo "| Yesterday (daily rate) | \$${DAILY_COST} |"
            echo "| Month to date | \$${MONTHLY_COST} |"
            echo ""
            if [ "${FAILED}" -eq 0 ] && [ "${REMAINING}" -eq 0 ]; then
              echo "### ✅ CLEAN DESTROY — All resources deleted. AWS bill = \$0 going forward"
              echo ""
              echo "> S3 state bucket (\`zord-infrastructure-aws-tf-state\`) still exists — delete manually if no longer needed."
            else
              echo "### ⚠️ ${FAILED} resource check(s) failed — some resources may still be billing you"
              echo ""
              echo "Check AWS Console manually for remaining resources."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
