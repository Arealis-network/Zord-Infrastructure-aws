name: S3 Buckets Terraform

run-name: >-
  ${{
    github.event_name == 'pull_request'
    && format('S3 Buckets PR Plan #{0}', github.event.pull_request.number)
    || format('S3 Buckets {0}',
        github.event.inputs.action || 'plan')
  }}

on:
  pull_request:
    paths:
      - "s3-buckets/**"
      - ".github/workflows/s3-buckets-terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Choose what you want to do with S3 buckets"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy
      confirm_destroy:
        description: "Type yes only when you really want to delete the buckets"
        required: false
        default: "no"
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: s3-buckets-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: "s3-buckets"
  AWS_REGION_VALUE: "ap-south-1"

jobs:
  terraform-plan-pr:
    name: Terraform Plan On PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION_VALUE }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-duration-seconds: 3600

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=s3-buckets/production/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION_VALUE }}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color

  terraform-manual:
    name: "Terraform ${{ github.event.inputs.action }}"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION_VALUE }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-duration-seconds: 3600

      - name: Validate destroy confirmation
        if: github.event.inputs.action == 'destroy'
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "yes" ]; then
            echo "Destroy was selected but confirm_destroy is not set to yes."
            exit 1
          fi

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=s3-buckets/production/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION_VALUE }}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event.inputs.action == 'plan'
        run: terraform plan -no-color

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve -no-color

      - name: Apply Summary
        if: github.event.inputs.action == 'apply'
        run: |
          {
            echo "## S3 Buckets Apply (production)"
            echo ""
            echo "### Buckets Created"
            echo ""
            echo "| Bucket | Name |"
            echo "|---|---|"
            terraform output -json bucket_names | jq -r 'to_entries[] | "| \(.key) | `\(.value)` |"'
            echo ""
            echo "All buckets are private with versioning and encryption enabled."
            echo ""
            echo "- State: \`s3-buckets/production/terraform.tfstate\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve -no-color

      - name: Destroy Summary
        if: github.event.inputs.action == 'destroy'
        run: |
          {
            echo "## S3 Buckets Destroy (production)"
            echo ""
            echo "- All 6 S3 buckets deleted"
            echo "- State: \`s3-buckets/production/terraform.tfstate\`"
          } >> "$GITHUB_STEP_SUMMARY"
